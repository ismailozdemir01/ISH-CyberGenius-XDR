[project]
name = "ish-cybergenuis-xdr"
version = "1.1.0"
description = "Defensive XDR investigation workspace with Microsoft Graph Security integration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
